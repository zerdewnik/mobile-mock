<!DOCTYPE html>
<html lang="ru" data-mode="student" data-role="curator">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>i4u mobile mock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css?v=202610061342" />
  </head>
  <body>
    <p class="page-label">
      Макет 1:1. Staff (фиолетовый) и студент (синий). Иконки — Material Icons
      Round/Outlined, как в Flutter. Профиль — кнопка человека в app bar.
    </p>

    <div class="toolbar-note mode-switch">
      <button type="button" class="chip chip-mode" data-mode="staff">
        Staff
      </button>
      <button type="button" class="chip chip-mode active" data-mode="student">
        Студент
      </button>
    </div>

    <div class="toolbar-note role-switch" id="roleSwitch" hidden>
      <span>Рөл:</span>
      <button type="button" class="chip chip-role active" data-role="curator">Куратор</button>
      <button type="button" class="chip chip-role" data-role="head">Бас куратор / Академ. бөлім</button>
    </div>

    <div class="toolbar-note" id="tabChips">
      <button type="button" class="chip" data-goto="0">Аналитика</button>
      <button type="button" class="chip" data-goto="1">Студенты</button>
      <button type="button" class="chip" data-goto="2">Уведомления</button>
      <button type="button" class="chip" data-goto="3">Мои группы</button>
    </div>

    <div class="phone-zoom" id="phoneZoom">
      <button type="button" class="chip" data-zoom="-1" title="Уменьшить">−</button>
      <span id="zoomVal">100%</span>
      <button type="button" class="chip" data-zoom="1" title="Увеличить">+</button>
      <button type="button" class="chip" id="zoomReset" title="Вернуть в центр">⟲</button>
      <span class="zoom-hint">тяните за рамку · угол — размер</span>
    </div>

    <div class="phone-stage" id="phoneStage">
    <div class="phone">
      <div class="phone-notch" aria-hidden="true"></div>
      <div class="app">
        <div class="status-bar">
          <span id="statusTime">13:14</span>
          <span class="status-icons">
            <span class="material-icons-round">signal_cellular_alt</span>
            <span class="material-icons-round">wifi</span>
            <span class="material-icons-round">battery_full</span>
          </span>
        </div>

        <header class="appbar" id="appbar"></header>
        <main class="content" id="content"></main>

        <nav class="bottom-nav" aria-label="App navigation">
          <div class="nav-hairline"></div>
          <div class="nav-row">
            <div class="nav-indicator" id="navIndicator"></div>

            <button type="button" class="nav-item" data-tab="0">
              <span
                class="nav-ico material-icons-outlined"
                data-out="assignment"
                data-fill="assignment"
                >assignment</span
              >
              <span class="nav-label">Аналитика</span>
            </button>
            <button type="button" class="nav-item" data-tab="1">
              <span
                class="nav-ico material-icons-outlined"
                data-out="people"
                data-fill="people"
                >people</span
              >
              <span class="nav-label">Студенты</span>
            </button>

            <div class="nav-center">
              <button type="button" class="nav-fab" id="navFab" title="Эфир">
                <span class="fab-ring">
                  <span class="fab-core">
                    <span class="material-icons-round" id="fabIcon">live_tv</span>
                  </span>
                </span>
              </button>
            </div>

            <button type="button" class="nav-item" data-tab="2">
              <span
                class="nav-ico material-icons-outlined"
                data-out="notifications_none"
                data-fill="notifications"
                >notifications_none</span
              >
              <span class="nav-label">Уведомления</span>
            </button>
            <button type="button" class="nav-item active" data-tab="3">
              <span
                class="nav-ico material-icons-round"
                data-out="groups"
                data-fill="groups"
                >groups</span
              >
              <span class="nav-label">Мои группы</span>
            </button>
          </div>
          <div class="nav-home-indicator"></div>
        </nav>

        <div class="overlay" id="overlay"></div>
        <div class="menu-layer" id="menuLayer" hidden></div>
        <div class="dialog-layer" id="dialogLayer" hidden></div>
        <div class="screen-overlay" id="screenOverlay" hidden></div>
        <div class="toast" id="toast"></div>
      </div>
    </div>
      <div class="phone-resize" id="phoneResize" title="Тяните, чтобы изменить размер"></div>
    </div>

    <script src="js/data.js?v=202610061342"></script>
    <script src="js/i18n.js?v=202610061342"></script>
    <script src="js/app.js?v=202610061342"></script>
  </body>
</html>
